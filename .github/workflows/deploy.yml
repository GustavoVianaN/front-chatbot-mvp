name: Verify Vercel production
# O frontend é publicado pela integração Git da Vercel. Não executar SSH.
on:
  deployment_status:
  workflow_dispatch:
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.production_environment == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check public frontend
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_PRODUCTION_URL || 'https://app.gustavoviana.com' }}
        run: |
          curl --fail --show-error --retry 3 --max-time 30 "$FRONTEND_URL/login" -o /dev/null
          curl --fail --show-error --retry 3 --max-time 30 "$FRONTEND_URL/signup" -o /dev/null
